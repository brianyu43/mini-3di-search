[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-3di-search"
version = "0.1.0.dev1"
description = "3Di search engine with exact k-mer filters and affine-gap alignment"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["psutil", "numpy", "numba"]

[project.optional-dependencies]
dev = ["biopython", "numpy", "pytest", "hypothesis", "ruff"]

[project.scripts]
m3di = "mini3di_search.cli:main"
m3di-fast = "mini3di_search.fast_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
